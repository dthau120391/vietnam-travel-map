name: Validate and publish

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # data well formed, pins inside their city, index.html rebuilt from src + data, script parses
      - run: python3 tools/validate.py
      # a real browser: no script errors, every city lists places, details open on desktop and phone
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.64.0
      - run: node tools/smoke.mjs index.html
        env:
          CHROME: /usr/bin/google-chrome
      - run: mkdir _site && cp index.html _site/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
