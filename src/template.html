<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="__DESC__">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Bản đồ Du lịch & Ẩm thực Việt Nam">
<meta property="og:description" content="__DESC__">
<meta property="og:image" content="__OGIMG__">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<title>Bản đồ Du lịch & Ẩm thực Việt Nam — Hồ Chí Minh · Đà Lạt · Nha Trang · Mỹ Tho</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous">
<style>
:root { --brand:#1F4E79; --brand2:#2d6aa3; --bg:#f4f6f9; --line:#e3e7ec; --muted:#5f6b7a; --hot:#ff4d2e; --gold:#c9a227; --card:#fff; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:var(--bg); color:#1d2733; display:flex; flex-direction:column; }
a { color:var(--brand2); }
button { font:inherit; cursor:pointer; }

/* ── header ─────────────────────────────── */
.top { background:var(--brand); color:#fff; display:flex; align-items:center; gap:14px; padding:10px 16px; flex-wrap:wrap; }
.brand h1 { font-size:18px; line-height:1.2; }
.brand small { font-size:12px; opacity:.85; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; }
.tabs button { border:1.5px solid rgba(255,255,255,.55); background:transparent; color:#fff; border-radius:18px; padding:6px 14px; font-weight:600; font-size:14px; }
.tabs button .n { font-weight:400; opacity:.8; font-size:12px; margin-left:4px; }
.tabs button.active { background:#fff; color:var(--brand); border-color:#fff; }
.tools { margin-left:auto; display:flex; gap:8px; align-items:center; }
.tools input { width:260px; max-width:52vw; border:0; border-radius:18px; padding:8px 14px; font-size:14px; }
.tools .ibtn { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:50%; width:34px; height:34px; font-size:16px; }

/* ── filters ────────────────────────────── */
.filters { display:flex; gap:6px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto; align-items:center; }
.chip { flex:none; display:inline-flex; align-items:center; gap:5px; border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:5px 11px; font-size:13px; color:#344054; white-space:nowrap; }
.chip .dot { width:9px; height:9px; border-radius:50%; background:var(--c); }
.chip .n { color:var(--muted); font-size:12px; }
.chip.on { border-color:var(--c, var(--brand)); background:color-mix(in srgb, var(--c, var(--brand)) 12%, #fff); color:#111; font-weight:600; }
.chip.off { opacity:.5; }
.sep { flex:none; width:1px; height:22px; background:var(--line); margin:0 4px; }
.chip.toggle.on { --c:var(--hot); }
.chip.michelin.on { --c:#b8001f; }
.chip.grp { font-weight:600; }
.chip.m-want.on { --c:#e8a317; }
.chip.m-been.on { --c:#12b76a; }
.chip.m-skip.on { --c:#667085; }
.badge.m-want { background:#fff6db; color:#8a6100; font-weight:600; }
.badge.m-been { background:#ecfdf3; color:#067647; font-weight:600; }
.badge.m-skip { background:#f2f4f7; color:#475467; font-weight:600; }
.card.m-been .thumb { filter:saturate(.35); }
.card.m-skip { opacity:.55; }
.progress { font-size:12px; color:var(--muted); padding:6px 12px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#fafbfc; }
.progress .bar { flex:1; min-width:80px; height:6px; border-radius:3px; background:#e4e7ec; overflow:hidden; }
.progress .bar i { display:block; height:100%; background:#12b76a; }
.progress button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 8px; font-size:12px; }
.marks { display:flex; gap:6px; margin-top:12px; }
.marks button { flex:1; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:8px 4px; font-size:13px; font-weight:600; color:#344054; }
.marks button.on[data-m="want"] { background:#fff6db; border-color:#e8a317; color:#8a6100; }
.marks button.on[data-m="been"] { background:#ecfdf3; border-color:#12b76a; color:#067647; }
.marks button.on[data-m="skip"] { background:#f2f4f7; border-color:#667085; color:#344054; }
.mynote { width:100%; margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font:inherit; font-size:13.5px; min-height:54px; resize:vertical; }
.pin.m-want { box-shadow:0 0 0 3px #e8a317, 0 2px 8px rgba(0,0,0,.35); }
.pin.m-been { filter:saturate(.3) brightness(1.05); }
.pin-badge { position:absolute; top:-6px; right:-8px; font-size:13px; background:#fff; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.pin-holder { position:relative; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1d2733; color:#fff; padding:10px 16px; border-radius:10px; font-size:13.5px; z-index:9999; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:92vw; }
.importbar { background:#fffaeb; border-bottom:1px solid #f5d77a; padding:8px 16px; font-size:13.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.importbar[hidden] { display:none; }
.homebar { display:flex; gap:6px; align-items:center; padding:6px 12px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); flex-wrap:wrap; background:#f5fbff; }
.homebar[hidden] { display:none; }
.homebar button { border:1px solid var(--line); background:#fff; border-radius:12px; padding:3px 9px; font-size:12px; }
.homebar button.on { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
.progress .mk { border:1px solid var(--line); background:#fff; border-radius:12px; padding:2px 8px; font-size:12px; }
.progress .mk.on { background:#1d2733; color:#fff; border-color:#1d2733; }
.rank { display:inline-block; min-width:22px; color:var(--muted); font-weight:700; font-size:12px; }
.card .home { color:#0b6bcb; font-weight:600; }
.warnbox { background:#fff4e5; border:1px solid #f5b971; border-left:4px solid #e8590c; color:#7a3e00; border-radius:10px; padding:8px 10px; font-size:13.5px; line-height:1.45; margin-top:10px; }
.badge.unv { background:#ffe8cc; color:#a14800; font-weight:600; }
.home-pin { font-size:26px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
.leaflet-container.picking { cursor:crosshair; }
.pick-banner { position:absolute; z-index:1000; top:10px; left:50%; transform:translateX(-50%); background:#1d2733; color:#fff; padding:8px 14px; border-radius:10px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.3); }
.pick-banner button { margin-left:10px; border:0; border-radius:6px; padding:3px 8px; }
.home-pop button { display:block; width:100%; margin-top:6px; border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 8px; font-size:13px; cursor:pointer; }
.importbar button { border:1px solid #d9b43c; background:#fff; border-radius:8px; padding:4px 10px; font-size:13px; }
.importbar button.primary { background:#1F4E79; color:#fff; border-color:#1F4E79; }

/* ── layout ─────────────────────────────── */
.wrap { flex:1; display:flex; min-height:0; }
.side { width:400px; flex:none; display:flex; flex-direction:column; background:#fff; border-right:1px solid var(--line); min-height:0; position:relative; }
.side-head { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); gap:8px; }
.side-head select { font:inherit; border:1px solid var(--line); border-radius:8px; padding:4px 6px; background:#fff; }
.list { overflow-y:auto; flex:1; }
#map { flex:1; min-height:300px; }

/* ── cards ──────────────────────────────── */
.card { display:flex; gap:10px; padding:10px 12px; border-bottom:1px solid #eef0f3; cursor:pointer; }
.card:hover, .card.sel { background:#eef5ff; }
.thumb { flex:none; width:76px; height:76px; border-radius:10px; overflow:hidden; background:linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 55%, #fff)); display:flex; align-items:center; justify-content:center; font-size:30px; position:relative; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb .k { position:absolute; bottom:0; left:0; right:0; font-size:9px; background:rgba(0,0,0,.55); color:#fff; text-align:center; padding:1px 0; }
.card .body { min-width:0; flex:1; }
.card h3 { font-size:14.5px; color:var(--brand); line-height:1.25; margin-bottom:2px; }
.card .sub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .row { font-size:12px; color:#344054; margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
.stars { color:#e8a317; font-weight:700; }
.rsrc { color:var(--muted); }
.badges { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.badge { font-size:10.5px; padding:2px 7px; border-radius:10px; background:#f0f2f5; color:#344054; white-space:nowrap; }
.badge.hot { background:#fff0ec; color:#c2391b; }
.badge.mich { background:#fde8ec; color:#a3001b; font-weight:600; }
.badge.warn { background:#fff6db; color:#8a6100; }
.dist { color:var(--brand2); font-weight:600; }
.empty { padding:30px 16px; text-align:center; color:var(--muted); font-size:14px; }

/* ── detail ─────────────────────────────── */
.detail { position:absolute; inset:0; background:#fff; overflow-y:auto; z-index:5; }
.detail[hidden] { display:none; }
.d-top { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; padding:8px 10px; background:rgba(255,255,255,.95); border-bottom:1px solid var(--line); }
.d-top button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 10px; font-size:13px; }
.gal-main { position:relative; height:240px; background:linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 50%, #fff)); display:flex; align-items:center; justify-content:center; font-size:64px; }
.gal-main img { width:100%; height:100%; object-fit:cover; display:block; }
.gal-cap { position:absolute; left:0; right:0; bottom:0; font-size:10.5px; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.7)); padding:14px 8px 5px; }
.gal-cap a { color:#fff; }
.gal-kind { position:absolute; top:8px; left:8px; font-size:11px; background:rgba(0,0,0,.6); color:#fff; padding:2px 8px; border-radius:10px; }
.gal-thumbs { display:flex; gap:6px; padding:6px 12px 0; }
.gal-thumbs img { width:62px; height:44px; object-fit:cover; border-radius:6px; cursor:pointer; opacity:.6; border:2px solid transparent; }
.gal-thumbs img.on { opacity:1; border-color:var(--brand2); }
.d-body { padding:12px 14px 30px; }
.d-body h2 { font-size:20px; color:var(--brand); line-height:1.25; }
.d-body .sub { font-size:13px; color:var(--muted); margin-top:2px; }
.rate { display:flex; align-items:center; gap:10px; margin:10px 0 4px; padding:8px 10px; border-radius:10px; background:#fffaf0; border:1px solid #f5e3b8; }
.rate .big { font-size:24px; font-weight:800; color:#b7791f; }
.rate .meta { font-size:12px; color:#6b5a2e; line-height:1.35; }
.rate.none { background:#f6f7f9; border-color:var(--line); }
.rate.none .meta { color:var(--muted); }
.facts { margin:10px 0; display:grid; grid-template-columns:26px 1fr; gap:6px 4px; font-size:13.5px; }
.facts dt { text-align:center; }
.facts dd { color:#24303d; }
.d-body h4 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; }
.d-body p { font-size:14px; line-height:1.55; }
.rv { border-radius:10px; padding:8px 10px; font-size:13.5px; line-height:1.5; margin-bottom:6px; }
.rv.pro { background:#ecfdf3; border-left:4px solid #12b76a; }
.rv.con { background:#fef3f2; border-left:4px solid #f04438; }
.rv b { display:block; font-size:12px; margin-bottom:2px; }
.tip { background:#eff8ff; border-left:4px solid #2e90fa; border-radius:10px; padding:8px 10px; font-size:13.5px; line-height:1.5; margin-top:10px; }
.actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.actions a, .actions button { display:inline-flex; align-items:center; gap:5px; text-decoration:none; font-size:13px; padding:7px 11px; border-radius:8px; border:1px solid var(--line); background:#fff; color:#1d2733; }
.actions a.primary { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600; }
.actions button.saved { background:#fff0f6; border-color:#f3a5c4; color:#c2255c; }
.srcs { font-size:12px; line-height:1.7; }
.srcs a { margin-right:10px; white-space:nowrap; }
.note { font-size:12px; color:var(--muted); margin-top:8px; }

/* ── map pins ───────────────────────────── */
.pin-wrap { background:none; border:0; }
.pin { width:32px; height:32px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--c); border:2.5px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
.pin span { transform:rotate(45deg); font-size:15px; line-height:1; }
.pin.hot { box-shadow:0 0 0 3px var(--hot), 0 2px 8px rgba(255,77,46,.6); }
.pin.approx { border-style:dashed; }
.pin.sel { width:40px; height:40px; box-shadow:0 0 0 4px #fff, 0 0 0 7px var(--brand2), 0 4px 10px rgba(0,0,0,.4); }
.leaflet-tooltip.tt { font-size:12px; font-weight:600; }
.me-dot { width:16px; height:16px; border-radius:50%; background:#2e90fa; border:3px solid #fff; box-shadow:0 0 0 6px rgba(46,144,250,.25); }
.leaflet-bar a.loc { font-size:16px; line-height:30px; text-decoration:none; }

/* ── info dialog ────────────────────────── */
dialog { margin:auto; max-width:640px; width:92vw; border:0; border-radius:14px; padding:20px 22px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
dialog::backdrop { background:rgba(10,20,30,.45); }
dialog h2 { color:var(--brand); font-size:18px; margin-bottom:8px; }
dialog p, dialog li { font-size:13.5px; line-height:1.55; margin-bottom:6px; }
dialog ul { padding-left:18px; }
dialog .close { float:right; border:0; background:#f0f2f5; border-radius:8px; padding:4px 10px; }

@media (max-width: 820px) {
  .top { padding:8px 10px; gap:8px; }
  .brand h1 { font-size:15px; }
  .tools { margin-left:0; width:100%; }
  .tools input { flex:1; width:auto; max-width:none; }
  .wrap { flex-direction:column; }
  #map { flex:none; height:44vh; order:-1; }
  .side { width:100%; border-right:0; flex:1; min-height:50vh; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>🇻🇳 Bản đồ Du lịch & Ẩm thực Việt Nam</h1>
    <small id="meta"></small>
  </div>
  <nav class="tabs" id="tabs" aria-label="Thành phố"></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="Tìm quán, món ăn, địa điểm…" aria-label="Tìm kiếm">
    <button class="ibtn" id="infoBtn" title="Về dữ liệu & cách dùng">ℹ️</button>
  </div>
</header>
<div class="importbar" id="importbar" hidden></div>
<div class="filters" id="filters" aria-label="Bộ lọc"></div>
<main class="wrap">
  <aside class="side">
    <div class="side-head">
      <span id="count"></span>
      <select id="sort" aria-label="Sắp xếp"></select>
    </div>
    <div class="homebar" id="homebar" hidden></div>
    <div class="progress" id="progress"></div>
    <div id="list" class="list"></div>
    <article id="detail" class="detail" hidden></article>
  </aside>
  <div id="map" role="application" aria-label="Bản đồ"></div>
</main>

<dialog id="info">
  <button class="close" id="infoClose">Đóng ✕</button>
  <h2>Về bản đồ này</h2>
  <div id="infoBody"></div>
</dialog>

<script id="places-data" type="application/json">__DATA__</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('places-data').textContent);
const CITIES = DATA.cities;
const CATS = {
  food:       { label:'Ăn uống',            emoji:'🍜', color:'#e4572e' },
  cafe:       { label:'Cà phê',             emoji:'☕', color:'#8d5524' },
  sight:      { label:'Tham quan',          emoji:'🏛️', color:'#2e86ab' },
  shopping:   { label:'Mua sắm',            emoji:'🛍️', color:'#a23b72' },
  market:     { label:'Chợ & phố ẩm thực',  emoji:'🧺', color:'#f18f01' },
  nightlife:  { label:'Về đêm',             emoji:'🍸', color:'#6a4c93' },
  nature:     { label:'Thiên nhiên',        emoji:'🌿', color:'#2a9d8f' },
  experience: { label:'Trải nghiệm',        emoji:'🎟️', color:'#3d5a80' },
  kids:       { label:'Khu vui chơi',       emoji:'🧸', color:'#ec4899' },
  music:      { label:'Cà phê acoustic',    emoji:'🎸', color:'#7c3aed' },
  wellness:   { label:'Massage & trị liệu', emoji:'💆', color:'#0f9d8a' }
};
// The filter tabs. "Tất cả" means the five focus groups; sights, nature and bars sit apart under "other".
const GROUPS = {
  eat:   { label:'Ăn uống',          emoji:'🍜', color:'#e4572e' },
  cafe:  { label:'Cà phê',           emoji:'☕', color:'#8d5524' },
  music: { label:'Cà phê acoustic',  emoji:'🎸', color:'#7c3aed' },
  relax: { label:'Massage & thư giãn', emoji:'💆', color:'#0f9d8a' },
  shop:  { label:'Mua sắm',          emoji:'🛍️', color:'#a23b72' },
  kids:  { label:'Khu vui chơi',     emoji:'🧸', color:'#ec4899' },
  other: { label:'Tham quan & khác', emoji:'🏛️', color:'#2e86ab' }
};
const PLACES = DATA.places.filter(p => p.status === 'open' || p.status === 'unverified');   // closed and removed never show
const BY_ID = new Map(PLACES.map(p => [p.id, p]));

// ── helpers ──────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? esc(u) : '';
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const fmtN = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace('.', ',') + 'k' : String(n);
const stars5 = r => r ? r.v * 5 / (r.scale || 5) : 0;   // a /10 score counts as its five-star equivalent
const rSrc = r => (r.src || host(r.url) || '').split(/[\s(]/)[0];   // "Foody.vn (thang điểm 10)" -> "Foody.vn"
const fmtR = r => r.v.toFixed(1).replace('.', ',') + (r.scale === 10 ? '/10' : '');
const isMich = p => (p.tags || []).some(t => /michelin/i.test(t));
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
function km(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function visible() {
  const q = fold(state.q.trim());

    if (state.grp === 'all' ? p.grp === 'other' : p.grp !== state.grp) return false;
    if (state.hot && !p.hot) return false;
    if (state.mich && !isMich(p)) return false;
    if (state.radius && homeHere() && !(p.lat != null && km(home, [p.lat, p.lng]) <= state.radius)) return false;
    const mk = markOf(p.id);
    if (state.mark ? mk !== state.mark : mk === 'skip') return false;   // skipped places hide unless you ask for them
    if (q) {
      const hay = fold([p.name, p.sub, p.addr, p.must, p.desc, (p.tags || []).join(' '), CATS[p.cat].label, GROUPS[p.grp].label].join(' '));
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;

  else if (state.sort === 'home' && homeHere()) a.sort((x, y) => dHome(x) - dHome(y));
  else if (state.sort === 'fameNear' && homeHere()) a.sort((x, y) => (y.fame - dHome(y)) - (x.fame - dHome(x)));   // each km away costs one fame point
  else if (state.sort === 'rating') a.sort((x, y) => stars5(y.rating) - stars5(x.rating) || (y.rating ? y.rating.n : 0) - (x.rating ? x.rating.n : 0));

}

function setMark(id, m) {

  if (!next && !cur.note) delete marks[id];
  else marks[id] = { ...cur, s:next || undefined, t:Date.now() };
  store.set(marks);
  const p = BY_ID.get(id), mk = markers.get(id);
  if (mk) mk.setIcon(pinIcon(p, state.sel === id));
  renderDetail(p); renderFilters(); renderList();
  if (next) toast(`${MARKS[next].emoji} ${p.name}: ${MARKS[next].label}`);
}
function setNote(id, note) {
  const cur = marks[id] || {};
  note = note.trim().slice(0, 500);
  if (!note && !cur.s) delete marks[id]; else marks[id] = { ...cur, note:note || undefined, t:Date.now() };
  store.set(marks);
  toast('Đã lưu ghi chú');
}

  $('#progress').innerHTML = `<span>✅ Đã đi <b>${been}</b>/${all.length}</span><span class="bar"><i style="width:${pct}%"></i></span>` +
    mk('want', `🎯 ${n('want')}`) + mk('been', `✅ ${been}`) + mk('skip', `🚫 ${n('skip')}`) +
    `<button id="shareBtn" title="Tạo link chứa danh sách của bạn để gửi bạn bè">🔗 Chia sẻ</button>`;

const b64u = {
  enc: bytes => {
    let bin = '';

    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  dec: s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))
};
async function pack(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (!window.CompressionStream) return 'j' + b64u.enc(raw);
  const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  return 'z' + b64u.enc(new Uint8Array(buf));
}
async function unpack(s) {
  const bytes = b64u.dec(s.slice(1));
  if (s[0] === 'j') return JSON.parse(new TextDecoder().decode(bytes));
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}
async function shareMarks() {
  const ids = Object.keys(marks).filter(id => BY_ID.has(id) && (marks[id].s || marks[id].note));
  if (!ids.length) { toast('Bạn chưa đánh dấu địa điểm nào.'); return; }
  const payload = {}; for (const id of ids) payload[id] = [marks[id].s || '', marks[id].note || ''];
  const url = `${location.href.split('#')[0]}#${state.city}&marks=${await pack(payload)}`;
  try {
    if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) await navigator.share({ title:'Danh sách du lịch của mình', url });
    else { await navigator.clipboard.writeText(url); toast(`Đã sao chép link (${ids.length} địa điểm) — dán gửi bạn bè`); }
  } catch { prompt('Sao chép link này:', url); }
}
async function checkImport(hash) {
  const m = (hash || '').match(/[&#]marks=([A-Za-z0-9_-]+)/);
  if (!m) return;
  let data;
  try { data = await unpack(m[1]); } catch { toast('Link chia sẻ bị lỗi, không đọc được.'); return; }
  if (!data || typeof data !== 'object' || Array.isArray(data)) { toast('Link chia sẻ bị lỗi, không đọc được.'); return; }
  const entries = Object.entries(data).filter(([id]) => BY_ID.has(id));
  const cnt = k => entries.filter(([, v]) => Array.isArray(v) && v[0] === k).length;
  const bar = $('#importbar');
  bar.innerHTML = `<span>📥 Link chia sẻ có <b>${entries.length}</b> địa điểm đã đánh dấu (✅ ${cnt('been')} · 🎯 ${cnt('want')} · 🚫 ${cnt('skip')}).</span>
    <button class="primary" id="impMerge">Gộp vào danh sách của tôi</button><button id="impNo">Không, cảm ơn</button>`;
  bar.hidden = false;
  const done = () => { bar.hidden = true; history.replaceState(null, '', `#${state.city}`); };
  $('#impNo').onclick = done;
  $('#impMerge').onclick = () => {
    let added = 0;
    for (const [id, v] of entries) {
      const s = Array.isArray(v) && isMark(v[0]) ? v[0] : null;          // a share link is untrusted input
      const note = Array.isArray(v) && typeof v[1] === 'string' ? v[1].slice(0, 500) : '';
      const cur = marks[id] || {};
      const next = { ...cur };
      if (s && !markOf(id)) { next.s = s; added++; }
      if (note && !cur.note) next.note = note;
      next.t = Date.now(); marks[id] = next;
    }
    store.set(marks);
    for (const [id] of entries) { const mk = markers.get(id); if (mk) mk.setIcon(pinIcon(BY_ID.get(id), false)); }
    renderFilters(); renderList(); done();
    toast(`Đã gộp ${added} đánh dấu mới (giữ nguyên đánh dấu sẵn có của bạn)`);
  };
}

// ── home: set by the visitor, kept in this browser only ──
const HOME_KEY = 'vnmap-home';
let home = (() => {
  try { const h = JSON.parse(localStorage.getItem(HOME_KEY)); if (Array.isArray(h) && h.length === 2 && h.every(Number.isFinite)) return h; } catch {}
  return Array.isArray(DATA.home) ? DATA.home : null;   // a private local copy may carry one; the published page never does
})();
// A point belongs to the city whose box holds it; Hồ Chí Minh's and Mỹ Tho's boxes overlap, so the nearer centre wins.
function cityOf(pt) {
  if (!pt) return null;
  const inside = Object.entries(CITIES).filter(([, c]) => { const [s, w, n, e] = c.bbox; return pt[0] >= s && pt[0] <= n && pt[1] >= w && pt[1] <= e; });
  inside.sort((a, b) => km(a[1].center, pt) - km(b[1].center, pt));
  return inside.length ? inside[0][0] : null;
}
const homeHere = () => cityOf(home) === state.city;
let homeLayer = null, picking = false, stopPick = null;
function saveHome(h) {
  home = h;
  try { h ? localStorage.setItem(HOME_KEY, JSON.stringify(h)) : localStorage.removeItem(HOME_KEY); } catch {}
  drawHome(); renderSort(); renderList();
}
function drawHome() {
  if (homeLayer) homeLayer.remove();
  homeLayer = null;
  if (!home) return;
  const pop = L.DomUtil.create('div', 'home-pop');
  pop.innerHTML = '<b>🏠 Nhà của tôi</b><br><small>Chỉ lưu trong trình duyệt này.</small><button data-a="move">📍 Đặt lại vị trí</button><button data-a="del">🗑️ Xóa nhà</button>';
  pop.querySelector('[data-a=move]').onclick = () => { map.closePopup(); startPick(); };
  pop.querySelector('[data-a=del]').onclick = () => { map.closePopup(); state.radius = 0; if (/home|fameNear/.test(state.sort)) state.sort = 'fame'; saveHome(null); };
  homeLayer = L.layerGroup([
    L.circle(home, { radius:1000, color:'#0b6bcb', weight:1, dashArray:'4 4', fill:false, interactive:false }),
    L.circle(home, { radius:2000, color:'#0b6bcb', weight:1, dashArray:'2 6', fill:false, interactive:false }),
    L.marker(home, { icon:L.divIcon({ className:'pin-wrap', html:'<div class="home-pin">🏠</div>', iconSize:[28, 28], iconAnchor:[14, 26] }), zIndexOffset:2000, title:'Nhà của tôi' }).bindPopup(pop)
  ]).addTo(map);
}
function startPick() {
  picking = true;
  map.getContainer().classList.add('picking');
  const b = L.DomUtil.create('div', 'pick-banner', map.getContainer());
  b.innerHTML = '🏠 Bấm vào bản đồ tại nơi bạn ở <button>Hủy</button>';
  map.removeLayer(cluster);   // place pins would catch the click in a dense area, so they step aside while picking
  const stop = () => { stopPick = null; picking = false; map.getContainer().classList.remove('picking'); b.remove(); map.off('click', onPick); map.addLayer(cluster); };
  const onPick = e => {
    stop(); saveHome([+e.latlng.lat.toFixed(5), +e.latlng.lng.toFixed(5)]);
    toast(homeHere() ? 'Đã đặt Nhà của tôi — danh sách hiện khoảng cách 🏠' : 'Đã đặt Nhà của tôi — điểm này nằm ngoài khu vực thành phố đang xem');
  };
  stopPick = stop;
  b.querySelector('button').onclick = e => { L.DomEvent.stop(e); stop(); };
  L.DomEvent.disableClickPropagation(b);
  map.on('click', onPick);
}
function renderHomebar() {
  const bar = $('#homebar');
  if (!homeHere()) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = '🏠 Quanh nhà:' + [[0, 'Tất cả'], [1, '≤ 1 km'], [2, '≤ 2 km'], [3, '≤ 3 km']]
    .map(([r, l]) => `<button data-r="${r}" class="${state.radius === r ? 'on' : ''}">${l}</button>`).join('');
  bar.querySelectorAll('button').forEach(b => b.onclick = () => { state.radius = +b.dataset.r; renderList(); });
}
function renderSort() {
  const opts = [['fame', 'Nổi tiếng & đáng đi nhất']];
  if (homeHere()) opts.push(['fameNear', 'Đáng đi nhất gần nhà'], ['home', 'Gần nhà nhất']);
  opts.push(['rating', 'Đánh giá cao'], ['name', 'Tên A–Z'], ['near', 'Gần tôi nhất (GPS)']);
  if (!opts.some(([v]) => v === state.sort)) state.sort = 'fame';
  $('#sort').innerHTML = opts.map(([v, l]) => `<option value="${v}"${v === state.sort ? ' selected' : ''}>${l}</option>`).join('');
}

// ── selection & navigation ───────────────────────────
let selMarker = null;
function highlight(id) {
  if (selMarker) { const old = BY_ID.get(selMarker); const m = markers.get(selMarker); if (m && old) { m.setIcon(pinIcon(old, false)); m.setZIndexOffset(0); } }
  selMarker = id;
  const m = id && markers.get(id);
  if (m) { m.setIcon(pinIcon(BY_ID.get(id), true)); m.setZIndexOffset(1000); }
}
function flyTo(p, z) {
  const m = markers.get(p.id);
  if (!m) return;
  cluster.zoomToShowLayer(m, () => map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), z || 16), { duration:.6 }));
}
function select(id, fly) {
  const p = BY_ID.get(id);
  if (!p) return;
  if (stopPick) stopPick();   // choosing a place ends a home pick; flyTo needs the pins back on the map
  if (p.city !== state.city) setCity(p.city, false);
  state.sel = id;
  renderDetail(p);
  highlight(id);
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.id === id));
  if (fly !== false) flyTo(p, 16);
  history.replaceState(null, '', `#${p.city}/${p.id}`);
}
function closeDetail() {
  $('#detail').hidden = true;
  state.sel = null;
  highlight(null);
  history.replaceState(null, '', `#${state.city}`);
}
function fitCity(all) {
  const c = CITIES[state.city];
  const pts = cityPlaces(state.city).filter(p => p.lat != null && (all || km(c.center, [p.lat, p.lng]) <= c.core)).map(p => [p.lat, p.lng]);
  if (pts.length > 1) map.fitBounds(pts, { padding:[30, 30], maxZoom:15 });
  else map.setView(c.center, c.zoom);
}
function setCity(city, fit) {
  state.city = city;
  if (state.grp !== 'all' && !PLACES.some(p => p.city === city && p.grp === state.grp)) state.grp = 'all';
  state.sel = null;
  $('#detail').hidden = true;
  highlight(null);
  renderTabs(); renderFilters(); renderSort(); renderList();
  if (fit !== false) fitCity(false);
  history.replaceState(null, '', `#${city}`);
}

// ── geolocation ──────────────────────────────────────
let meMarker = null;
function locate(prevSort) {
  const fail = msg => {
    alert(msg);
    if (prevSort) { state.sort = prevSort; $('#sort').value = prevSort; renderList(); }   // the menu must say what the list does
  };
  if (!navigator.geolocation) { fail('Trình duyệt không hỗ trợ định vị.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    state.me = [pos.coords.latitude, pos.coords.longitude];
    if (meMarker) meMarker.remove();
    meMarker = L.marker(state.me, { icon:L.divIcon({ className:'pin-wrap', html:'<div class="me-dot"></div>', iconSize:[16, 16] }), title:'Bạn đang ở đây' }).addTo(map);
    // jump to the city you are in, if it is one of ours
    const here = cityOf(state.me);
    if (here && here !== state.city) setCity(here, false);
    state.sort = 'near'; $('#sort').value = 'near';
    renderList();
    map.flyTo(state.me, 15);
  }, err => fail('Không lấy được vị trí: ' + err.message), { enableHighAccuracy:true, timeout:10000 });
}

// ── events ───────────────────────────────────────────
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-city]'); if (b) setCity(b.dataset.city); });
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.grp) state.grp = b.dataset.grp;          // one tab at a time
  else if (b.dataset.tog) state[b.dataset.tog] = !state[b.dataset.tog];
  renderFilters(); renderList();
});
$('#list').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) select(c.dataset.id, true); });
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#sort').addEventListener('change', e => {
  if (e.target.value === 'near' && !state.me) { locate(state.sort); return; }   // state.sort changes only once a position arrives
  state.sort = e.target.value;
  renderList();
});
$('#infoBtn').onclick = () => $('#info').showModal();
$('#infoClose').onclick = () => $('#info').close();
$('#info').addEventListener('click', e => { if (e.target === $('#info')) $('#info').close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#detail').hidden && !$('#info').open) closeDetail(); });

// ── info dialog & header meta ────────────────────────
const total = PLACES.length;
$('#meta').textContent = `${total} địa điểm · ${Object.keys(CITIES).length} thành phố · cập nhật ${DATA.generated}`;
$('#infoBody').innerHTML = DATA.infoHtml;

// ── boot ─────────────────────────────────────────────
(function boot() {
  const hash0 = location.hash;                  // setCity() rewrites the hash, so read it first
  const hm = hash0.match(/[&#]home=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);   // a private "set my home" link: stored here, then dropped from the URL
  if (hm && Math.abs(+hm[1]) <= 90 && Math.abs(+hm[2]) <= 180) { home = [+hm[1], +hm[2]]; try { localStorage.setItem(HOME_KEY, JSON.stringify(home)); } catch {} }
  drawHome();
  const [c, id] = decodeURIComponent(hash0.slice(1).split('&')[0]).split('/');
  setCity(CITIES[c] ? c : 'hcmc');
  if (id && BY_ID.has(id)) select(id, true);
  checkImport(hash0);
})();
</script>
</body>
